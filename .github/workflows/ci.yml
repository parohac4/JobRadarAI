name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: jobradar_secret
          POSTGRES_DB: jobradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Unit tests
        run: pytest backend/tests/test_dedup.py backend/tests/test_email_parse.py -q
      - name: API integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://jobradar:jobradar_secret@localhost:5432/jobradar
          SECRET_KEY: test-secret
          ADMIN_EMAIL: admin@test.local
          ADMIN_PASSWORD: testpass
        run: pytest backend/tests/test_api.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
