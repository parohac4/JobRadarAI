# Produkce za Apache na hostu (bez Caddy na :80/:443)
# Spouštění vždy s: sudo docker compose --env-file .env -f deploy/docker-compose.apache.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD chybí – spouštějte s --env-file .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobradar}
    volumes:
      - jobradar_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobradar}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-jobradar}
      ROOT_PATH: ${PUBLIC_PATH:-/nastenka}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8787:8000"
    security_opt:
      - no-new-privileges:true

  worker:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobradar}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-jobradar}
      ROOT_PATH: ${PUBLIC_PATH:-/nastenka}
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.worker
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE: ${PUBLIC_PATH:-/nastenka}/api/v1
        VITE_BASE_PATH: ${PUBLIC_PATH:-/nastenka}/
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:80"
    security_opt:
      - no-new-privileges:true

volumes:
  jobradar_pg:
