# Produkce za Apache na hostu (bez Caddy na :80/:443)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jobradar}
    volumes:
      - jobradar_pg:/var/lib/postgresql/data

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jobradar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-jobradar}
    depends_on:
      - db
    ports:
      - "127.0.0.1:8787:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE: ${PUBLIC_PATH:-/nastenka}/api/v1
        VITE_BASE_PATH: ${PUBLIC_PATH:-/nastenka}/
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:80"

volumes:
  jobradar_pg:
