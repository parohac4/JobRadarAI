# HTTPS :443 – vytvořeno certbotem (certbot --apache), upraveno na společný include.
# Na serveru: /etc/apache2/sites-available/chcetejelena-le-ssl.conf
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName chcetejelena.cz
    ServerAlias www.chcetejelena.cz
    ServerAdmin webmaster@chcetejelena.cz

    Include /etc/apache2/sites-available/chcetejelena-common.inc
    Header always set Strict-Transport-Security "max-age=31536000"

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/chcetejelena.cz/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chcetejelena.cz/privkey.pem
</VirtualHost>
</IfModule>
