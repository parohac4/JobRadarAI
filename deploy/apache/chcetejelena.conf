# HTTP :80 – jen přesměrování na HTTPS (Let's Encrypt HTTP-01 obnova projde přes redirect).
# Na serveru: /etc/apache2/sites-available/chcetejelena.conf
<VirtualHost *:80>
    ServerName chcetejelena.cz
    ServerAlias www.chcetejelena.cz
    ServerAdmin webmaster@chcetejelena.cz

    Include /etc/apache2/sites-available/chcetejelena-common.inc

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =chcetejelena.cz [OR]
    RewriteCond %{SERVER_NAME} =www.chcetejelena.cz
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
